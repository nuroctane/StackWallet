name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (core, cli, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude stackwallet-tauri --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check -p stackwallet-wasm --target wasm32-unknown-unknown

  web:
    name: TypeScript (packages, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      # The wasm core is built before the tests so the bridge test exercises
      # the real binary against the hand-written TypeScript surface.
      - run: pnpm --filter @stackwallet/web build:wasm
      - run: pnpm test
      - run: pnpm --filter @stackwallet/web build:web
      - run: test -f apps/web/dist/wasm/stackwallet_wasm_bg.wasm

  desktop:
    name: Desktop (Tauri crate check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p stackwallet-tauri
