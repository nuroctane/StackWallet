# Deploy the web app Worker (`stackwallet`, workers.dev) on every push to main.
#
# Deploys through wrangler-action when CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# are set as repository secrets. Without the token the run stays green, logs that
# the deploy was skipped, and still opens+closes a `deployment` issue so GitHub
# notifies on every main push. If Workers Builds (dashboard git integration) is
# ever connected as the deployer, unset the token here to avoid double deploys.

name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-stackwallet
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  issues: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_NAME: StackWallet
      SITE_URL: https://stackwallet.civetadeicollegium.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Cloudflare token
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN unset - deploy skipped. Set it with: gh secret set CLOUDFLARE_API_TOKEN"
          fi

      - name: Setup Rust (wasm core)
        if: steps.cf.outputs.has_token == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        if: steps.cf.outputs.has_token == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        if: steps.cf.outputs.has_token == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Setup pnpm
        if: steps.cf.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.cf.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.cf.outputs.has_token == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web
        if: steps.cf.outputs.has_token == 'true'
        run: pnpm --filter @stackwallet/web build

      - name: Deploy
        if: steps.cf.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
          packageManager: pnpm

      - name: Verify live
        if: steps.cf.outputs.has_token == 'true'
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
            if [ "$code" = "200" ]; then
              curl -s "$SITE_URL/" | grep -q '<title>StackWallet</title>' && { echo "live"; exit 0; }
            fi
            sleep 5
          done
          echo "::error::$SITE_URL did not answer 200 with the StackWallet page"
          exit 1

      - name: Notify GitHub
        if: always() && (success() || steps.cf.outputs.has_token == 'false')
        uses: actions/github-script@v7
        env:
          HAS_TOKEN: ${{ steps.cf.outputs.has_token }}
        with:
          script: |
            const site = process.env.SITE_NAME;
            const url = process.env.SITE_URL;
            const via = process.env.HAS_TOKEN === 'true' ? 'github-actions' : 'skipped (no CLOUDFLARE_API_TOKEN)';
            const sha = context.sha.slice(0, 7);
            const msg = (context.payload.head_commit?.message || context.sha).split('\n')[0].slice(0, 72);
            const title = `Deployed ${site} @ ${sha} - ${msg}`;
            const body = [
              `**${site}** production deploy`,
              ``,
              `- Site: ${url}`,
              `- Commit: \`${context.sha}\``,
              `- Actor: @${context.actor}`,
              `- Path: \`${via}\``,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'deployment' });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'deployment',
                color: '0E8A16',
                description: 'Production deploy notifications',
              });
            }

            // Fresh issue + assign + close = a real GitHub notification per ship.
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['deployment'],
              assignees: [context.repo.owner],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.data.number,
              state: 'closed',
            });

            if (process.env.HAS_TOKEN !== 'true') return;
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'production',
                auto_merge: false,
                required_contexts: [],
                description: title,
                production_environment: true,
              });
              if (deployment.data?.id) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.data.id,
                  state: 'success',
                  environment_url: url,
                  log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  description: 'Live via github-actions',
                });
              }
            } catch (e) {
              core.warning(`deployment record skipped: ${e.message}`);
            }
