packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  '@tauri-apps/cli': true
  workerd: true

# Supply-chain defense: a package version must be at least one day old before
# pnpm will install it. Malicious npm releases are usually pulled within hours.
# Do not lower this in a wallet codebase.
minimumReleaseAge: 1440
minimumReleaseAgeExclude: []
