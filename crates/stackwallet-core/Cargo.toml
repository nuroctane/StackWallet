[package]
name = "stackwallet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "StackWallet core: vault, threshold signing, policy engine, transport, audit"

[lib]
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
argon2 = "0.6"
chacha20poly1305 = "0.11"
hkdf = "0.13"
ed25519-dalek = { version = "3", features = ["zeroize"] }
frost-ed25519 = "3"
frost-secp256k1-tr = "3"
frost-core = "3"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled", "serialize"], optional = true }
k256 = { version = "0.13", features = ["schnorr"] }
# Keccak-256 for EVM sighashes and addresses; same digest generation as sha2 0.10.
sha3 = "0.10"
rand_core_06 = { version = "0.6", package = "rand_core", features = ["getrandom"] }
# hkdf 0.13 is built on digest 0.11, which the workspace-wide sha2 0.10 does not implement.
sha2_v011 = { version = "0.11", package = "sha2", default-features = false }
hmac = { version = "0.13", default-features = false }
# Constant-time comparison for export key verifiers.
subtle = "2.6"
base64 = "0.22"
bs58 = "=0.5.1"
bech32 = "=0.11.0"
ripemd = "=0.1.3"
prost = "=0.14.1"
bitcoin = { version = "=0.32.11", default-features = false, features = ["std"] }
# Noise with pure-Rust primitives only; the default resolver would pull ring,
# which does not build for wasm32.
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2", "use-sha2", "use-getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# Blake2b for Substrate, Sui, Cardano and Algorand-style hashing; digest 0.10 like sha2.
blake2 = "0.10"
crc = "3"
data-encoding = "2"
curve25519-dalek = "5"
blake3 = { version = "1", default-features = false, features = ["pure"] }

[features]
default = ["store"]
# SQLite via rusqlite is native-only; the wasm build leaves it off.
store = ["dep:rusqlite"]
# Families under construction; each compiles only with its feature until it is wired in.
fam-substrate = []
fam-sui = []
fam-aptos = []
fam-stellar = []
fam-near = []
fam-ton = []
fam-xrpl = []
fam-cardano = []
fam-hyperliquid = []
fam-algorand = []
fam-vechain = []
fam-multiversx = []
fam-antelope = []
fam-stacks = []
fam-tezos = []
fam-starknet = []
fam-icp = []
fam-waves = []
fam-neo = []
fam-ergo = []
fam-icon = []
fam-alephium = []
fam-chia = []
fam-everscale = []
fam-radix = []
fam-aeternity = []
fam-fuel = []
fam-aelf = []
fam-starcoin = []
fam-obyte = []
fam-chromia = []
fam-keeta = []
fam-namada = []
fam-btcfork = []
fam-gala = []
# curve25519-dalek 5 is already in the lock (via ed25519-dalek 3); Mixin's ghost-key
# scheme is raw edwards25519 arithmetic, not standard ed25519. blake3 (CC0/Apache-2.0)
# is the kernel's transaction hash; the pure-Rust backend avoids a C toolchain.
fam-mixin = []

# Browser builds need the JS entropy backends; getrandom 0.4 also needs the
# getrandom_backend="wasm_js" cfg set in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

