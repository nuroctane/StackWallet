[package]
name = "stackwallet-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser surface for stackwallet-core"

[lib]
crate-type = ["cdylib", "rlib"]

# Current rustc emits bulk-memory and non-trapping float ops for wasm32; the
# wasm-opt that wasm-pack pins rejects them unless told they are allowed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
stackwallet-core = { path = "../stackwallet-core", default-features = false }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
